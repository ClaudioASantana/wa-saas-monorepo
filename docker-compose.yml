version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wa-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    env_file:
      - .env
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wa-api
    restart: always
    ports:
      - '4005:4005'
    environment:
      - NODE_ENV=production
      - PORT=4005
      - REDIS_URL=redis://redis:6379/1
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - TZ=UTC
      - DATABASE_URL=postgresql://postgres:admin_password@postgres:5432/flux-crm?schema=public
      - WHATSAPP_ENGINE_URL=http://whatsapp-engine:3001
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  whatsapp-engine:
    build:
      context: .
      dockerfile: apps/whatsapp-engine/Dockerfile
    container_name: whatsapp-engine
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:admin_password@postgres:5432/flux-crm?schema=public
    env_file:
      - .env
    volumes:
      - ./apps/whatsapp-engine/src:/app/src
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:alpine
    container_name: wa-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - wa_redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: wa-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: flux-crm
    ports:
      - '5449:5432'
    volumes:
      - wa_postgres_data:/var/lib/postgresql/data

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
    container_name: wa-marketing
    restart: always
    ports:
      - '3002:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wa-cloudflare-tunnel
    restart: always
    command: tunnel run
    volumes:
      - ./cloudflare-tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflare-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - api
      - web
      - marketing

  mailpit:
    image: axllent/mailpit:latest
    container_name: wa-mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - wa_mailpit_data:/data

volumes:
  wa_redis_data:
  wa_postgres_data:
  wa_mailpit_data:
