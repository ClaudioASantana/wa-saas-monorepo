version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wa-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wa-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_URL=redis://redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - TZ=UTC
    depends_on:
      redis:
        condition: service_started

  whatsapp-engine:
    build:
      context: .
      dockerfile: apps/whatsapp-engine/Dockerfile
    container_name: whatsapp-engine
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_URL=redis://redis:6379/1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./apps/whatsapp-engine/src:/app/src
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:alpine
    container_name: wa-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - wa_redis_data:/data

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
    container_name: wa-marketing
    restart: always
    ports:
      - '3002:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001

  supabase-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: wa-supabase-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=54322
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=public --blobs
      - SCHEDULE=0 3 * * *
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=2
      - BACKUP_KEEP_MONTHS=1
      - HEALTHCHECK_PORT=8080
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./supabase/backups:/backups

  cloudflare-tunnel-api:
    image: cloudflare/cloudflared:latest
    container_name: wa-cloudflare-tunnel-api
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:4000
    depends_on:
      - api

  cloudflare-tunnel-web:
    image: cloudflare/cloudflared:latest
    container_name: wa-cloudflare-tunnel-web
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:3000
    depends_on:
      - web

volumes:
  wa_redis_data:
