version: '3.3'

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.1
    container_name: evolution-api
    restart: always
    ports:
      - '8080:8080'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_URL=http://localhost:8080 # Url that will be used to generate webhooks and qr codes
      - DANGEROUS_FUNCTIONS=true # Enable dangerous functions like delete messages
      - CORS_ORIGIN=* # allow all origins
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS # Set log level

      # Authentication for Evolution API Panel/Requests
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=B6D711FCDE4D4FD5936544120E713976 # CHANGE THIS IN PRODUCTION
      - AUTHENTICATION_EXPOSE_IN_SERVER=true

      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?schema=public&connection_limit=5&pool_timeout=0
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api

      # Redis is strongly recommended for caching instances and avoiding rate limit
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6

      # Webhooks
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_EVENTS_ERRORS=true
      - WEBHOOK_EVENTS_ERRORS_WEBHOOK=

      # RabbitMQ (Not needed for simple setups)
      - RABBITMQ_ENABLED=false
      - SQID_ENABLED=false
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=false

      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    ports:
      - '5433:5432' # use 5433 on host in case 5432 is taken by supabase local
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: evolution-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_postgres:
  evolution_redis:
